name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Autoload smoke
        run: php -r 'require "vendor/autoload.php"; new TapCub\TapCub("k", "https://example.com"); echo "ok\n";'
